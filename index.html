        <h1>CATT-Web — Tabelas Termodinâmicas Computacionais Online (CATT / CATT3 Web)</h1>
        <p>
          O CATT-Web é uma calculadora gratuita de propriedades termodinâmicas para estudantes e engenheiros.
          Ative o JavaScript para usar os cálculos interativos, diagramas T-s e P-v e traçador de processos.
        </p>
        <ul>
          <li>Água e Vapor (IAPWS-IF97) — líquido comprimido, mistura saturada e vapor superaquecido</li>
          <li>20 Fluidos Refrigerantes (R-134a, R-22, R-410A, CO2, R-12, R-404A, R-407C e mais)</li>
          <li>11 Fluidos Criogênicos (Amônia, Nitrogênio, Oxigênio, Argônio, Hélio, Metano, Propano)</li>
          <li>Tabela de Ar (Tabela A-17 / A-22) com calores específicos variáveis, Pr e vr</li>
          <li>12 Gases Ideais (NIST Shomate) com cp, cv e k</li>
          <li>Fator de Compressibilidade Generalizado (Z — Lee-Kesler / Pitzer)</li>
          <li>Psicrometria (Ar Úmido — ASHRAE Fundamentals)</li>
        </ul>
      </main>
    </noscript>
