<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Minimalist Phase Diagram / Vapor Dome Curve -->
  <path d="M 5 25 C 10 18, 13 8, 16 8 C 19 8, 22 18, 27 25" stroke="#000000" stroke-width="2" stroke-linecap="square"/>
  <!-- Critical Point Dot -->
  <circle cx="16" cy="8" r="2" fill="#000000"/>
